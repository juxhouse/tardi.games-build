<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tardi Game Dev</title>
  <style>
    :root { font-size: calc(6px + 1.2vmin); }

    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; }
    body { display: grid; grid-template-rows: minmax(0, 1fr);
      gap: clamp(10px, 1vw, 18px); padding: clamp(10px, 1vw, 18px); box-sizing: border-box; }
    .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    /* Each side of the table holds one or two hands, stacked and sharing its height. */
    .side { display: flex; flex-direction: column; gap: clamp(10px, 1vw, 18px);
      min-width: 0; min-height: 0; }
    .side .col { flex: 1; }
    /* A fixed line-height so the table can subtract its caption's exact height. */
    .label { font-size: 0.8rem; line-height: 1.2; opacity: 0.7; margin: 0 0 6px; }
    .picker { display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 2rem; margin: 0 0 clamp(10px, 1vw, 18px); }
    .picker span { opacity: 0.7; margin-right: 10px; }
    .picker button { font: inherit; color: inherit; background: #1e293b;
      border: 1px solid #334155; border-radius: 10px; padding: 5px 25px; cursor: pointer; }
    .picker button:hover { background: #334155; }
    .picker button.current { background: #2563eb; border-color: #2563eb; cursor: default; }
    /* Counts outside game.json's players range stay clickable, to see how the
       game copes, but look it. */
    .picker button.outside { border-style: dashed; opacity: 0.6; }
    /* The space left under the label (for the table, under the player buttons).
       The frame is centred in it, so a table that does not fill the column is
       letterboxed rather than pinned to a corner. */
    .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .frame { border: 0; width: 100%; height: 100%; border-radius: 8px; background: #020617; }
    /* The table's caption rides on top of the letterboxed frame, not at the top
       of the column, so it always sits right above the screen it names. */
    .screen { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .screen .frame { flex: 1; min-height: 0; }
    /* The Shared Screen is always 16:9 here, whatever shape the dev's window is.
       Sizing off the stage's own box (cq units) is the only way to fit a ratio
       inside a box that can be limited by either side; width:100% + max-height
       squashes the frame when the stage is short and wide. Browsers without
       container queries keep the stretched frame above: wrong shape, still usable. */
    .stage.table { container-type: size; }
    @supports (container-type: size) {
      /* The caption (0.8rem at line-height 1.2, plus its 6px margin) shares
         the stage's height with the frame, so leave it out of the 16:9 fit. */
      .stage.table .screen {
        width: min(100cqw, calc((100cqh - 0.96rem - 6px) * 16 / 9));
        height: auto;
      }
      .stage.table .frame {
        flex: none;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    }
    .banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: #15803d; padding: 8px 18px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <script>
    // The dev harness shipped with @juxhouse/tardi-build: hosts one table and one
    // hand per player for the game in the current directory, and routes messages
    // between them, doing the same intent translation the Tardi platform does.
    // No PeerJS, no lobby. Run with `npm run dev`.
    //
    // It is generic: the game's title and player count come from its game.json,
    // which the dev server serves at /game.json. A game that wants a different
    // harness can put its own dev/index.html in its repo; that one wins.
    (function () {
      var SCRIPT = { table: '/dist/table.js', hand: '/dist/hand.js' }
      // The most hands the harness lays out: two stacked on each side of the table.
      var MAX_PLAYERS = 4

      var banner = document.createElement('div')
      banner.className = 'banner'

      var players = []
      var handFrames = {}
      var table

      loadGame(start)

      // The harness cannot be built until we know how many hands to show, so it
      // waits for game.json. A game.json that is missing or unreadable is a bug
      // in the game, not a reason to show nothing: fall back to two players.
      function loadGame(done) {
        var request = new XMLHttpRequest()
        request.open('GET', '/game.json', true)
        request.onload = function () {
          var game = {}
          try {
            game = JSON.parse(request.responseText)
          } catch (e) {
            warn('game.json is not valid JSON, so the harness is using its defaults.')
          }
          done(game)
        }
        request.onerror = function () {
          warn('No game.json found, so the harness is using its defaults.')
          done({})
        }
        request.send()
      }

      function start(game) {
        if (game.title) document.title = 'Tardi Game Dev - ' + game.title
        players = makePlayers(game)

        // The table, wider, in the middle, with the hands split between the sides:
        // the first half on the left, the rest on the right, stacked when a side
        // has two. minmax(0, ...) rather than a bare fr: a column must be allowed
        // to be narrower than the game rendered inside it, or a wide table pushes
        // the hands off screen.
        var left = Math.ceil(players.length / 2)
        var leftSide = makeSide()
        var rightSide = players.length > left ? makeSide() : null
        document.body.style.gridTemplateColumns =
          'minmax(0, 1fr) minmax(0, 1.9fr)' + (rightSide ? ' minmax(0, 1fr)' : '')

        table = makeFrame('Table (Shared Screen)', SCRIPT.table, true)
        addPicker(table, game)
        for (var i = 0; i < players.length; i++) {
          (i < left ? leftSide : rightSide).appendChild(makeHand(players[i]).col)
        }
        document.body.appendChild(leftSide)
        document.body.appendChild(table.col)
        if (rightSide) document.body.appendChild(rightSide)
        document.body.appendChild(banner)

        window.addEventListener('message', onMessage)
        // The platform tells the table who is playing; do the same once it loads.
        table.frame.addEventListener('load', notifyPlayers)
      }

      function makePlayers(game) {
        var count = playerCount(game)
        var made = []
        for (var i = 1; i <= count; i++) {
          made.push({ playerId: 'p' + i, nick: 'Player ' + i })
        }
        return made
      }

      // The dev picks a count with the buttons above the table, which reload the
      // page with ?players=N. Without one, dev on the game's minimum: the
      // configuration every game supports and the one it is usually written for.
      function playerCount(game) {
        var match = /[?&]players=(\d+)/.exec(window.location.search)
        var asked = match ? parseInt(match[1], 10) : 0
        if (asked >= 1 && asked <= MAX_PLAYERS) return asked
        return minPlayers(game)
      }

      function minPlayers(game) {
        return (game.players && game.players.min) || 2
      }

      function maxPlayers(game) {
        return (game.players && game.players.max) || minPlayers(game)
      }

      function makeSide() {
        var side = document.createElement('div')
        side.className = 'side'
        return side
      }

      // Puts the player-count buttons at the top of the table's column.
      function addPicker(made, game) {
        var picker = document.createElement('div')
        picker.className = 'picker'
        var title = document.createElement('span')
        title.textContent = 'Players'
        picker.appendChild(title)
        for (var n = 1; n <= MAX_PLAYERS; n++) {
          picker.appendChild(makeCountButton(n, game))
        }
        made.col.insertBefore(picker, made.col.firstChild)
      }

      function makeCountButton(n, game) {
        var button = document.createElement('button')
        button.type = 'button'
        button.textContent = String(n)
        var classes = []
        if (n === players.length) classes.push('current')
        if (n < minPlayers(game) || n > maxPlayers(game)) {
          classes.push('outside')
          button.title = 'Outside the ' + minPlayers(game) + '-' + maxPlayers(game) +
            ' players this game declares in game.json'
        }
        button.className = classes.join(' ')
        button.onclick = function () {
          if (n !== players.length) window.location.search = '?players=' + n
        }
        return button
      }

      function onMessage(event) {
        var msg = event.data || {}
        if (event.source === table.frame.contentWindow) {
          fromTable(msg)
        } else {
          fromHand(event.source, msg)
        }
      }

      function fromTable(msg) {
        if (msg.intent === 'tardi.table.sendMessageToHand') {
          var frame = handFrames[msg.playerId]
          if (frame) {
            frame.contentWindow.postMessage(
              assign({}, msg, { intent: 'tardi.table.sendGameStateToHand' }), '*')
          }
        } else if (msg.intent === 'tardi.table.gameOver') {
          show(msg.victor ? nickOf(msg.victor) + ' wins!' : 'Draw!')
        }
      }

      function fromHand(source, msg) {
        var playerId = handIdOf(source)
        if (!playerId) return
        if (msg.intent === 'tardi.hand.sendMessageToTable' || msg.intent === 'tardi.hand.ackTableState') {
          table.frame.contentWindow.postMessage(
            { intent: 'tardi.platform.sendToTable', playerId: playerId, payload: msg }, '*')
        }
      }

      function notifyPlayers() {
        table.frame.contentWindow.postMessage(
          { intent: 'tardi.platform.notifyPlayersChange', players: players }, '*')
      }

      function makeHand(player) {
        var made = makeFrame('Hand - ' + player.nick, SCRIPT.hand)
        handFrames[player.playerId] = made.frame
        return made
      }

      function makeFrame(label, scriptUrl, isTable) {
        var col = document.createElement('div')
        col.className = 'col'
        var caption = document.createElement('p')
        caption.className = 'label'
        caption.textContent = label
        var stage = document.createElement('div')
        stage.className = isTable ? 'stage table' : 'stage'
        var frame = document.createElement('iframe')
        frame.className = 'frame'
        frame.title = label
        frame.sandbox = 'allow-scripts allow-same-origin'
        frame.srcdoc = srcdoc(scriptUrl)
        if (isTable) {
          var screen = document.createElement('div')
          screen.className = 'screen'
          screen.appendChild(caption)
          screen.appendChild(frame)
          stage.appendChild(screen)
        } else {
          stage.appendChild(frame)
          col.appendChild(caption)
        }
        col.appendChild(stage)
        return { col: col, frame: frame }
      }

      function srcdoc(scriptUrl) {
        return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
          '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
          '<style>html,body{margin:0;width:100%;height:100%;background:#020617;color:#f8fafc}</style>' +
          '</head><body><script src="' + scriptUrl + '"><\/script></body></html>'
      }

      function handIdOf(source) {
        for (var id in handFrames) {
          if (handFrames[id].contentWindow === source) return id
        }
        return null
      }

      function nickOf(playerId) {
        for (var i = 0; i < players.length; i++) {
          if (players[i].playerId === playerId) return players[i].nick
        }
        return playerId
      }

      function show(text) {
        banner.textContent = text
        banner.style.display = 'block'
      }

      function warn(text) {
        if (window.console && console.warn) console.warn('tardi-build dev: ' + text)
      }

      // The harness runs in the dev browser, but that can be an old browser
      // too, and Object.assign is not there before Chromium 45.
      function assign(target) {
        for (var i = 1; i < arguments.length; i++) {
          var source = arguments[i]
          for (var key in source) {
            if (Object.prototype.hasOwnProperty.call(source, key)) target[key] = source[key]
          }
        }
        return target
      }
    }())
  </script>
</body>
</html>
